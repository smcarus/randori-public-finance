[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovrisk"
version = "0.5.0"
description = "Sovereign risk scorecard, scenarios, backtests and Monte Carlo (Randori M-13 port; untested, preliminary)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pyyaml>=6", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8"]
dashboard = ["plotly>=5"]

[tool.setuptools]
packages = ["sovrisk"]

[tool.setuptools.package-data]
sovrisk = ["assets/*"]
