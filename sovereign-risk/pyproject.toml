[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovrisk"
version = "0.8.1"
description = "Randori Public Finance models RPF-01 to RPF-06: sovereign scorecard, PFRAM, municipal scorecard, debt sustainability (MAC SRDSF, LIC DSF), early warning and spillover (untested, preliminary)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pyyaml>=6", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8", "sdmx1>=2.20"]
data = ["sdmx1>=2.20"]
dashboard = ["plotly>=5"]

[tool.setuptools]
packages = ["sovrisk", "sovrisk.srdsf", "sovrisk.licdsf"]

[tool.setuptools.package-data]
sovrisk = ["assets/*"]
